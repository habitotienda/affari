# Blueprint de Render: New > Blueprint > elegí tu repo de GitHub
services:
  - type: web
    name: affari
    runtime: python
    plan: free
    region: oregon            # elegí la más cercana a tu base de Supabase
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 1 --chdir backend app:app --bind 0.0.0.0:$PORT --timeout 120 --forwarded-allow-ips="*"
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_TZ
        value: America/Argentina/Buenos_Aires
      - key: DATABASE_URL          # Supabase > Connect > Session pooler (Render free no tiene IPv6)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEYS
        sync: false
      - key: GROK_API_KEYS        # opcional: claves de xAI (xai-...), separadas por coma; se usan después de las de Gemini
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_VIP_EMAILS
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL          # https://TU-APP.onrender.com (si lo dejás vacío se usa RENDER_EXTERNAL_URL)
        sync: false
